  <!-- Legend -->
  <circle cx="70" cy="1330" r="9" fill="#2563eb"/>
  <text x="88" y="1335" class="legend">Sprint 1</text>
  <circle cx="200" cy="1330" r="9" fill="#d97706"/>
  <text x="218" y="1335" class="legend">Sprint 2</text>
  <circle cx="330" cy="1330" r="9" fill="#15803d"/>
  <text x="348" y="1335" class="legend">Sprint 3</text>
