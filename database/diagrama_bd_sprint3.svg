<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1380" viewBox="0 0 1800 1380">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 38px 'DejaVu Sans', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px 'DejaVu Sans', sans-serif; fill: #475569; }
      .table-title { font: 700 20px 'DejaVu Sans', sans-serif; fill: #ffffff; letter-spacing: .4px; }
      .field { font: 400 15px 'DejaVu Sans Mono', monospace; fill: #1e293b; }
      .key { font-weight: 700; fill: #0f172a; }
      .relation { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .relation-label { font: 600 13px 'DejaVu Sans', sans-serif; fill: #475569; }
      .view-title { font: 700 16px 'DejaVu Sans', sans-serif; fill: #334155; }
      .view-text { font: 400 13px 'DejaVu Sans', sans-serif; fill: #64748b; }
      .legend { font: 600 14px 'DejaVu Sans', sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1800" height="1380" fill="#f8fafc"/>
  <text x="60" y="58" class="title">Base de datos — Sistema de mantenimiento predictivo</text>
  <text x="60" y="88" class="subtitle">Diagrama entidad–relación consolidado hasta el Sprint 3 · PostgreSQL</text>

  <!-- Relationships behind the entities -->
  <path class="relation" d="M320 220 H390"/>
  <text x="337" y="207" class="relation-label">1 : N</text>

  <path class="relation" d="M710 235 H1140"/>
  <text x="900" y="222" class="relation-label">registra 1 : N</text>

  <path class="relation" d="M1060 220 H1140"/>
  <text x="1070" y="207" class="relation-label">1 : N</text>

  <path class="relation" d="M1330 390 V475"/>
  <text x="1342" y="437" class="relation-label">1 : N</text>

  <path class="relation" d="M550 390 V440 H1120 V540"/>
  <text x="773" y="427" class="relation-label">técnico / registrador</text>

  <path class="relation" d="M550 390 V690 H455 V760"/>
  <text x="465" y="676" class="relation-label">registra lotes</text>

  <path class="relation" d="M1140 350 H1080 V760"/>
  <text x="1092" y="704" class="relation-label">genera mediciones</text>

  <path class="relation" d="M340 935 H840"/>
  <text x="515" y="922" class="relation-label">define la variable</text>

  <path class="relation" d="M770 945 H840"/>
  <text x="778" y="932" class="relation-label">1 : N</text>

  <path class="relation" d="M1260 945 H1320"/>
  <text x="1265" y="932" class="relation-label">0 : 1</text>

  <!-- Sprint 1 entities -->
  <g>
    <rect x="50" y="130" width="270" height="230" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <path d="M62 130 H308 Q320 130 320 142 V182 H50 V142 Q50 130 62 130" fill="#2563eb"/>
    <text x="72" y="164" class="table-title">ROLES</text>
    <text x="72" y="211" class="field key">PK  id_rol</text>
    <text x="72" y="241" class="field">UK  nombre</text>
    <text x="72" y="271" class="field">    descripcion</text>
    <text x="72" y="301" class="field">    activo</text>
    <text x="72" y="331" class="field">    creado_en</text>
  </g>

