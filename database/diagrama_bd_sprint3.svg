    <text x="432" y="871" class="field key">FK  registrado_por</text>
    <text x="432" y="901" class="field">    tipo_origen, estado</text>
    <text x="432" y="931" class="field">    nombre_archivo</text>
    <text x="432" y="961" class="field">    registros_totales</text>
    <text x="432" y="991" class="field">    validos, rechazados</text>
    <text x="432" y="1021" class="field">    iniciado_en, finalizado_en</text>
    <text x="432" y="1051" class="field">    detalle_error</text>
  </g>

  <g>
    <rect x="840" y="760" width="420" height="275" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
    <path d="M852 760 H1248 Q1260 760 1260 772 V812 H840 V772 Q840 760 852 760" fill="#15803d"/>
