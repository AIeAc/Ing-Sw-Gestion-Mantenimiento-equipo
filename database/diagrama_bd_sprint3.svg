    <text x="1142" y="706" class="field">    creado_en, actualizado_en</text>
  </g>

  <!-- Sprint 3 -->
  <g>
    <rect x="40" y="760" width="300" height="275" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
    <path d="M52 760 H328 Q340 760 340 772 V812 H40 V772 Q40 760 52 760" fill="#15803d"/>
