    <text x="1342" y="841" class="field key">PK  id_alerta</text>
    <text x="1342" y="871" class="field key">FK/UK  id_medicion</text>
    <text x="1342" y="901" class="field key">FK     atendida_por</text>
    <text x="1342" y="931" class="field">       tipo, estado</text>
    <text x="1342" y="961" class="field">       valor_medido</text>
    <text x="1342" y="991" class="field">       valor_minimo, valor_maximo</text>
    <text x="1342" y="1021" class="field">       atendida_en, observaciones</text>
    <text x="1342" y="1051" class="field">       generada_en</text>
