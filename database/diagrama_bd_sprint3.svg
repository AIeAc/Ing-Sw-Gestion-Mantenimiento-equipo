    <text x="862" y="841" class="field key">PK  id_medicion</text>
    <text x="862" y="871" class="field key">FK  id_equipo</text>
    <text x="862" y="901" class="field key">FK  id_variable</text>
    <text x="862" y="931" class="field key">FK  id_lote</text>
    <text x="862" y="961" class="field">    valor</text>
    <text x="862" y="991" class="field">    medido_en</text>
    <text x="862" y="1021" class="field">    creado_en · registro inmutable</text>
  </g>

  <g>
    <rect x="1320" y="760" width="430" height="305" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
    <path d="M1332 760 H1738 Q1750 760 1750 772 V812 H1320 V772 Q1320 760 1332 760" fill="#15803d"/>
