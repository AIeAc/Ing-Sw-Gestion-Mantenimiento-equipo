  <!-- Views -->
  <rect x="40" y="1115" width="1710" height="165" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="8 6" stroke-width="2"/>
  <text x="65" y="1152" class="view-title">VISTAS DERIVADAS</text>
  <text x="65" y="1185" class="view-title">historial_mantenimientos_equipo</text>
